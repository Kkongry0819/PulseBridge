name: Publish Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag matching Source/PulseBridge.csproj'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Select and validate version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content -LiteralPath 'Source/PulseBridge.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } elseif ($env:REQUESTED_TAG) { $env:REQUESTED_TAG } else { "v$version" }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$' -or $tag -ne "v$version") { throw "Tag must match project version v$version." }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "archive=PulseBridge-$tag-windows-x64.zip" >> $env:GITHUB_OUTPUT

      - name: Build the self-contained Windows application
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\Source\build.ps1' -Output (Join-Path $env:GITHUB_WORKSPACE 'artifacts\PulseBridge')
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }

      - name: Run the existing core checks
        run: |
          $ErrorActionPreference = 'Stop'
          $validation = Join-Path $env:RUNNER_TEMP 'PulseBridge-validation'
          New-Item -ItemType Directory -Path $validation -Force | Out-Null
          $report = Join-Path $validation 'core-tests.txt'
          $executable = Join-Path $env:GITHUB_WORKSPACE 'artifacts\PulseBridge\PulseBridge.exe'
          $process = Start-Process -FilePath $executable -ArgumentList @('--self-test','--report',('"' + $report + '"')) -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Core checks timed out.' }
          if ($process.ExitCode -ne 0) { if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }; throw 'Core checks failed.' }
          $results = Get-Content -LiteralPath $report | Where-Object { -not $_.StartsWith('NOTE ') }
          if (-not ($results -match '^SUCCESS 31 checks$')) { throw 'Expected 31 successful core checks.' }
          $results
          $results | Set-Content -LiteralPath 'artifacts\PulseBridge\CORE-TEST-REPORT.txt' -Encoding utf8

      - name: Package the application and calculate SHA256
        env:
          ARCHIVE_NAME: ${{ steps.version.outputs.archive }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:GITHUB_WORKSPACE 'artifacts\PulseBridge'
          $forbidden = Get-ChildItem -LiteralPath $package -Recurse -File | Where-Object {
            $_.Name -in 'settings.json','heart-rate.json','heart-rate.txt','session.lock' -or $_.Extension -eq '.tmp'
          }
          if ($forbidden) { throw 'Unexpected runtime data in release package.' }
          $archive = Join-Path $env:GITHUB_WORKSPACE ('artifacts\' + $env:ARCHIVE_NAME)
          Compress-Archive -LiteralPath $package -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          ($hash + '  ' + $env:ARCHIVE_NAME) | Set-Content -LiteralPath 'artifacts\SHA256SUMS.txt' -Encoding utf8
          Write-Output ("Archive bytes: " + (Get-Item -LiteralPath $archive).Length)
          Get-Content -LiteralPath 'artifacts\SHA256SUMS.txt'

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE_NAME: ${{ steps.version.outputs.archive }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:GITHUB_WORKSPACE ('artifacts\' + $env:ARCHIVE_NAME)
          $checksum = Join-Path $env:GITHUB_WORKSPACE 'artifacts\SHA256SUMS.txt'
          $notes = Join-Path $env:GITHUB_WORKSPACE ("docs\RELEASE-" + $env:RELEASE_TAG + ".md")
          if (-not (Test-Path -LiteralPath $notes)) { throw 'Add release notes for this version before publishing.' }
          gh release create $env:RELEASE_TAG $archive $checksum --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title ("PulseBridge " + $env:RELEASE_TAG + " · Windows x64") --notes-file $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publishing failed.' }
